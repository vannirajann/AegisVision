<!DOCTYPE html>
<html>

<head>

    <title>AegisVision Live Monitoring</title>

    <style>

        body {
            background-color: #111;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #00ff88;
        }

        #status {
            font-size: 25px;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 10px;
            background: #222;
        }

        img {
            width: 90%;
            max-width: 1100px;
            border: 3px solid red;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: white;
            background: green;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <h1>🛡 AegisVision Live Monitoring</h1>

    <div id="status">
        Checking security status...
    </div>

    <img src="/video-feed">

    <br>

    <a href="/">
        ← Back to Dashboard
    </a>


    <script>

        async function updateStatus() {

            try {

                const response =
                    await fetch("/status");

                const data =
                    await response.json();

                const status =
                    document.getElementById("status");


                if (
                    data.current_intruders > 0
                ) {

                    status.innerHTML =
                        "🚨 INTRUSION DETECTED! " +
                        "Current Intruders: " +
                        data.current_intruders;

                    status.style.background =
                        "red";

                }

                else {

                    status.innerHTML =
                        "🟢 AREA SECURE - No Intruders";

                    status.style.background =
                        "green";

                }

            }

            catch (error) {

                document.getElementById(
                    "status"
                ).innerHTML =
                    "⚠️ Unable to check status";

            }

        }


        // Update every second
        setInterval(
            updateStatus,
            1000
        );

        // Run immediately
        updateStatus();

    </script>

</body>

</html>
